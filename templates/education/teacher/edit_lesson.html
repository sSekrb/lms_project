<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать урок</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="{% url 'teacher_dashboard' %}">🎓 Умный школьник</a>
            <a href="{% url 'teacher_edit_course' lesson.course.id %}" class="btn btn-light btn-sm">← Назад</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>✏️ Редактировать урок</h1>
        <div class="card p-4 mt-3">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success">Сохранить</button>
            </form>
        </div>
    </div>
</body>
</html>
