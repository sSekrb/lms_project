<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать тест</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fc; }
        .btn { border-radius: 30px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .question-block { background: white; border-radius: 16px; }
        .answer-row { display: flex; align-items: center; gap: 10px; }
        .answer-row input[type="text"] { flex: 1; }
        .answer-row input[type="radio"] { width: 20px; height: 20px; margin: 0; }
        @media (max-width: 576px) { .btn { width: 100%; } .navbar .btn { width: auto; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success navbar-expand-md">
        <div class="container">
            <a class="navbar-brand" href="{% url 'teacher_dashboard' %}">🎓 Умный школьник</a>
            <a href="{% url 'teacher_dashboard' %}" class="btn btn-light btn-sm">← Назад</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>📝 Создать тест для курса "{{ course.title }}"</h1>

        <form method="post" id="testForm">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Название урока / теста</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Теоретический материал (необязательно)</label>
                <textarea name="content" class="form-control" rows="4"></textarea>
            </div>

            <div id="questionsContainer">
                <h4>Вопросы и ответы</h4>
                <div class="question-block mb-4 p-3">
                    <input type="text" name="question_text[]" class="form-control mb-2" placeholder="Вопрос">
                    <div class="answers-block">
                        <div class="answer-row mb-1">
                            <input type="radio" name="correct_0" value="0" class="form-check-input">
                            <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 1">
                        </div>
                        <div class="answer-row mb-1">
                            <input type="radio" name="correct_0" value="1" class="form-check-input">
                            <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 2">
                        </div>
                        <div class="answer-row mb-1">
                            <input type="radio" name="correct_0" value="2" class="form-check-input">
                            <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 3">
                        </div>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm remove-question mt-2">Удалить вопрос</button>
                </div>
            </div>

            <button type="button" class="btn btn-secondary" id="addQuestion">➕ Добавить вопрос</button>
            <button type="submit" class="btn btn-success">Сохранить тест</button>
        </form>
    </div>

    <script>
        let questionCounter = 1;

        document.getElementById('addQuestion').addEventListener('click', function () {
            const container = document.getElementById('questionsContainer');
            const newBlock = document.createElement('div');
            newBlock.className = 'question-block mb-4 p-3';
            newBlock.innerHTML = `
                <input type="text" name="question_text[]" class="form-control mb-2" placeholder="Вопрос">
                <div class="answers-block">
                    <div class="answer-row mb-1">
                        <input type="radio" name="correct_${questionCounter}" value="0" class="form-check-input">
                        <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 1">
                    </div>
                    <div class="answer-row mb-1">
                        <input type="radio" name="correct_${questionCounter}" value="1" class="form-check-input">
                        <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 2">
                    </div>
                    <div class="answer-row mb-1">
                        <input type="radio" name="correct_${questionCounter}" value="2" class="form-check-input">
                        <input type="text" name="answer_text[]" class="form-control" placeholder="Ответ 3">
                    </div>
                </div>
                <button type="button" class="btn btn-danger btn-sm remove-question mt-2">Удалить вопрос</button>
            `;
            container.appendChild(newBlock);
            questionCounter++;
        });

        document.addEventListener('click', function (e) {
            if (e.target.classList.contains('remove-question')) {
                const block = e.target.closest('.question-block');
                if (document.querySelectorAll('.question-block').length > 1) {
                    block.remove();
                } else {
                    alert('Должен быть хотя бы один вопрос.');
                }
            }
        });
    </script>
</body>
</html>
