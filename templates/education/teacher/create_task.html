<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать практическое задание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7fc; }
        .btn { border-radius: 30px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        @media (max-width: 576px) { .btn { width: 100%; } .navbar .btn { width: auto; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-success navbar-expand-md">
        <div class="container">
            <a class="navbar-brand" href="{% url 'teacher_dashboard' %}">🎓 Умный школьник</a>
            <a href="{% url 'teacher_dashboard' %}" class="btn btn-light btn-sm">← Назад</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>📋 Создать практическое задание для курса "{{ course.title }}"</h1>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Название урока / задания</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Теоретический материал (необязательно)</label>
                <textarea name="content" class="form-control" rows="4"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Описание практического задания</label>
                <textarea name="task_description" class="form-control" rows="6" required></textarea>
            </div>

            <button type="submit" class="btn btn-success">Создать задание</button>
        </form>
    </div>
</body>
</html>
